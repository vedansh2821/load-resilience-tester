<svg xmlns="http://www.w3.org/2000/svg" width="687" height="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="100%" height="100%" rx="8" fill="#0d1117"/>
<circle cx="20" cy="18" r="5" fill="#ff5f57"/><circle cx="38" cy="18" r="5" fill="#febc2e"/><circle cx="56" cy="18" r="5" fill="#28c840"/>
<text x="76" y="22" fill="#8b949e" font-size="12">terminal — help</text>
<text x="16" y="53" fill="#c9d1d9">load-resilience-tester -- test YOUR OWN server&#x27;s rate-limit / resilience</text>
<text x="16" y="72" fill="#c9d1d9"></text>
<text x="16" y="91" fill="#c9d1d9">Usage:</text>
<text x="16" y="110" fill="#c9d1d9">  java com.resilience.Main --target &lt;url&gt; --authorize [--rps N] [--duration S]</text>
<text x="16" y="129" fill="#c9d1d9"></text>
<text x="16" y="148" fill="#c9d1d9">  --target    URL to test. Loopback (localhost / 127.0.0.1 / ::1) only,</text>
<text x="16" y="167" fill="#c9d1d9">              or a host listed in allowlist.txt (one host per line).</text>
<text x="16" y="186" fill="#c9d1d9">  --authorize Required. Confirms you own the target or have written</text>
<text x="16" y="205" fill="#c9d1d9">              permission to test it. You will also be asked to type YES.</text>
<text x="16" y="224" fill="#c9d1d9">  --rps       Requests per second, 1-10 (default 5).</text>
<text x="16" y="243" fill="#c9d1d9">  --duration  Seconds, 1-60 (default 10). Total requests capped at 600.</text>
<text x="16" y="262" fill="#c9d1d9"></text>
<text x="16" y="281" fill="#c9d1d9">Demo (in another terminal, start the test server first):</text>
<text x="16" y="300" fill="#c9d1d9">  python3 demo/server.py</text>
<text x="16" y="319" fill="#c9d1d9">  java com.resilience.Main --target http://127.0.0.1:8765/ --authorize</text>
</svg>
